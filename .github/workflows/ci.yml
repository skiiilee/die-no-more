name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Layer dependency check (ADR-0002)
        run: npm run check:layers
      - name: Docs check
        run: npm run check:docs
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Official image ships the browsers and OS packages, so no apt install
    # (apt mirrors were unreachable from runners on 2026-11-11).
    # Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: E2E tests (no Supabase env; covers signed-out flows)
        run: npm run test:e2e
        env:
          HOME: /root

  db:
    runs-on: ubuntu-latest
    # Applies supabase/migrations to a fresh local Supabase stack and runs the
    # pgTAP RLS tests in supabase/tests. Needs Docker, which runners have.
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Start Postgres, Auth and Storage (migrations applied on start)
        run: >
          supabase start
          -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta,postgrest
      - name: RLS and integrity tests (pgTAP)
        run: supabase test db
      - name: Lint migrations
        run: supabase db lint --level warning

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
